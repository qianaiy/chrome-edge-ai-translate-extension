name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - name: 类型检查
        run: npm run typecheck

      - name: 单元测试
        run: npm run test

      - name: 敏感信息扫描
        run: npm run lint:secrets

      - name: 构建
        run: npm run build

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: extension-dist
          path: dist/
          retention-days: 7

  # 浏览器冒烟测试：真正把扩展装进 Chrome/Edge，验证后台能响应。
  # 只在有桌面的 runner 上跑（Windows / macOS）。
  smoke:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chrome, edge]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - name: 冒烟测试 (${{ matrix.browser }})
        run: |
          if ("${{ matrix.browser }}" -eq "edge") {
            npm run smoke:edge
          } else {
            npm run smoke
          }
